[project]
name = "hnx26eps06-backend"
version = "0.1.0"
description = "FastAPI backend for 3D Scene Generation from Blueprints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "shapely>=2.0.0",
    "networkx>=3.2.0",
    "trimesh>=4.2.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.8.0",
]

[tool.setuptools]
packages = ["app"]
